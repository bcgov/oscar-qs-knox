name: Version detect
description: Detect version for Polaris pipeline build action
inputs:
  GITHUB_TOKEN:
    description: GitHub Action Token
    required: true
  DEFAULT_VERSION:
    description: Default Version
    required: true
outputs:
  checkout_ref:
    description: Reference used to checkout repo
    value: ${{ steps.lookup-pr-merge-ref.outputs.checkout_ref }}
  version:
    description: Version used to label build
    value: ${{ steps.set-version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Lookup PR Merge Ref
      id: lookup-pr-merge-ref
      shell: bash
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "checkout_ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          echo "version_modifier=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        elif [[ ${{ github.ref_name != 'main' }} = true ]]; then
          RESPONSE=$(curl -s "https://api.github.com/repos/bcgov/oscar-qs-knox/pulls?head=bcgov:${{ github.head_ref || github.ref_name }}&state=open&base=main" \
            -H "Authorization: token ${{ inputs.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            --retry 2 \
            --max-time 30 \
            --connect-timeout 10 \
            --retry-delay 5)
          PULL_REQUEST_NUMBER=$(echo "${RESPONSE}" | jq -r .[0].number)
          RESPONSE=$(curl -s "https://api.github.com/repos/bcgov/oscar-qs-knox/pulls/$PULL_REQUEST_NUMBER" \
            -H "Authorization: token ${{ inputs.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            --retry 2 \
            --max-time 30 \
            --connect-timeout 10 \
            --retry-delay 5)
          MERGEABLE=$(echo "${RESPONSE}" | jq -r .mergeable)
          if [[ "$MERGEABLE" != "true" ]]; then
            echo "::error ::Pull request #$PULL_REQUEST_NUMBER is not mergeable… aborted."
            echo "This can be resolved by resolving the merge conflict with the main branch."
            exit 1
          fi
          echo "checkout_ref=refs/pull/$PULL_REQUEST_NUMBER/merge" >> $GITHUB_OUTPUT
          echo "version_modifier=$PULL_REQUEST_NUMBER" >> $GITHUB_OUTPUT
        else
          echo "checkout_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "version_modifier=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
    - name: Set version
      id: set-version
      shell: bash
      run: |
        if [[ ${{ startsWith(github.ref, 'refs/tags/v') }} = true ]]; then
          TAG=${{ github.ref_name }}
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        else
          echo "version=${DEFAULT_VERSION/%SNAPSHOT/${{ steps.lookup-pr-merge-ref.outputs.version_modifier }}-SNAPSHOT}" >> $GITHUB_OUTPUT
        fi
      env:
        DEFAULT_VERSION: ${{ inputs.DEFAULT_VERSION }}
